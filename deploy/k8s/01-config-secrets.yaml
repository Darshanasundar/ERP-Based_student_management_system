apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  namespace: erp
data:
  PORT: "3000"
  NODE_ENV: "production"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "erp_db"
  DB_USER: "postgres"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
  BACKEND_WEBHOOK_URL: "http://backend:3000/api/internal/emit-risk-update"
---
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: erp
type: Opaque
stringData:
  DB_PASSWORD: "postgres_secure_password_2026"
  JWT_SECRET: "super_secret_erp_jwt_encryption_key_2026_production"
