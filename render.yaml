services:
  # 1. Express Backend Web Service
  - type: web
    name: erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: erp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: erp-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # 2. Redis Cache
  - type: redis
    name: erp-redis
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: erp-postgres
    databaseName: erp_db
    user: postgres
    plan: free
